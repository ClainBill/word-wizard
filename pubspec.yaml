name: word_wizard
description: "Offline advanced-English vocabulary dictionary and SRS flashcards."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # Routing
  go_router: ^15.1.2

  # Pronunciation
  flutter_tts: ^4.2.2

  # Rendering the user's custom per-word notes
  flutter_markdown_plus: ^1.0.3

  # Daily word-reminder notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  html: ^0.15.7
  flutter_secure_storage: ^11.1.0

  # The progress screen's share card
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/db/
    - assets/crossword/
    - assets/hunt/

flutter_launcher_icons:
  android: true
  ios: true
  # App Store rejects icons with an alpha channel; flatten it for iOS only.
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#8A5A22"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
