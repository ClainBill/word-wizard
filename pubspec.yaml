name: word_wizard
description: "Offline advanced-English vocabulary dictionary and SRS flashcards."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # Routing
  go_router: ^15.1.2

  # Pronunciation
  flutter_tts: ^4.2.2

  # Rendering the user's custom per-word notes
  flutter_markdown_plus: ^1.0.3

  # Daily word-reminder notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  html: ^0.15.7
  flutter_secure_storage: ^11.1.0

  # The progress screen's share card
  share_plus: ^13.3.0

  # Settings → "Report a bug / suggest a feature": attach a photo from the library
  image_picker: ^1.1.2

  # Accounts, premium and the AI proxy — see supabase/README.md
  supabase_flutter: ^2.17.2
  # Purchases (RevenueCat) — the paywall; see lib/services/purchases_service.dart.
  purchases_flutter: ^10.13.1
  url_launcher: ^6.3.2
  # Ads for the free tier (AdMob); see lib/services/ads_service.dart.
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    # The dictionary (assets/db/dictionary.db) is deliberately not a Flutter
    # asset: Android ships it as an asset pack (android/dictionary_pack) and
    # iOS as a bundle resource (Runner target) — see DictionaryInstaller.
    - assets/crossword/
    - assets/hunt/
    # The hat-and-W mark on its own, for the sign-in sheet.
    - assets/icon/mark.png
    # Terms and privacy, shown in-app from the paywall and Settings.
    - docs/TERMS.md
    - docs/PRIVACY_POLICY.md

# Sources in assets/icon/ are composed from the pack in
# assets/word-wizard-icon-pack/ (tool/make_icons.py): the pack's rounded
# square has its corners baked in, and each platform wants a full square
# (iOS masks it) or a separate foreground layer (Android adaptive).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # App Store rejects icons with an alpha channel; flatten it for iOS only.
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E271A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
